{% extends "base.html" %}
{% block title %}Edit Department - HMS{% endblock %}
{% block page_title %}Edit Department{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3><i class="fas fa-building"></i> Edit Department: {{ department.name }}</h3>
        <a href="{{ url_for('departments.list_departments') }}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="card-body">
        <form method="POST" class="form-grid">
            <div class="form-group">
                <label for="name">Department Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" value="{{ department.name }}" required>
            </div>
            <div class="form-group full-width">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="3">{{ department.description or '' }}</textarea>
            </div>
            <div class="form-actions full-width">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Department</button>
                <a href="{{ url_for('departments.list_departments') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
