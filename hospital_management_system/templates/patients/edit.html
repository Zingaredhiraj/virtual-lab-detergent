{% extends "base.html" %}
{% block title %}Edit Patient - MediCore HMS{% endblock %}
{% block page_title %}Edit Patient{% endblock %}
{% block page_subtitle %}Update patient information{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3><i class="fas fa-user-edit"></i> Edit: {{ patient.name }}</h3>
        <a href="{{ url_for('patients.list_patients') }}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="card-body">
        <form method="POST" class="form-grid">
            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" value="{{ patient.name }}" required>
            </div>
            <div class="form-group">
                <label for="age">Age <span class="required">*</span></label>
                <input type="number" id="age" name="age" value="{{ patient.age }}" min="0" max="150" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender <span class="required">*</span></label>
                <select id="gender" name="gender" required>
                    <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                    <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                    <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="contact">Phone Number</label>
                <input type="text" id="contact" name="contact" value="{{ patient.contact or '' }}">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ patient.email or '' }}">
            </div>
            <div class="form-group full-width">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="2">{{ patient.address or '' }}</textarea>
            </div>
            <div class="form-group full-width">
                <label for="medical_history">Medical History</label>
                <textarea id="medical_history" name="medical_history" rows="3">{{ patient.medical_history or '' }}</textarea>
            </div>
            <div class="form-actions full-width">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Patient</button>
                <a href="{{ url_for('patients.list_patients') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
