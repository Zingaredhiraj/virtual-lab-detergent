{% extends "base.html" %}
{% block title %}Add Patient - HMS{% endblock %}
{% block page_title %}Add New Patient{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3><i class="fas fa-user-plus"></i> Add New Patient</h3>
        <a href="{{ url_for('patients.list_patients') }}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="card-body">
        <form method="POST" class="form-grid">
            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" required placeholder="Enter patient name">
            </div>
            <div class="form-group">
                <label for="age">Age <span class="required">*</span></label>
                <input type="number" id="age" name="age" required min="1" max="150" placeholder="Age">
            </div>
            <div class="form-group">
                <label for="gender">Gender <span class="required">*</span></label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="contact">Contact <span class="required">*</span></label>
                <input type="text" id="contact" name="contact" required placeholder="Phone number">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email address">
            </div>
            <div class="form-group full-width">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="2" placeholder="Full address"></textarea>
            </div>
            <div class="form-group full-width">
                <label for="medical_history">Medical History</label>
                <textarea id="medical_history" name="medical_history" rows="3" placeholder="Previous medical conditions, allergies, etc."></textarea>
            </div>
            <div class="form-actions full-width">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Patient</button>
                <a href="{{ url_for('patients.list_patients') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
