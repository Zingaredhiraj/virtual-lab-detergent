{% extends "base.html" %}
{% block title %}Add Prescription - MediCore HMS{% endblock %}
{% block page_title %}Add Prescription{% endblock %}
{% block page_subtitle %}Create a new prescription{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3><i class="fas fa-prescription"></i> New Prescription</h3>
        <a href="{{ url_for('prescriptions.list_prescriptions') }}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="card-body">
        <form method="POST" class="form-grid">
            <div class="form-group">
                <label for="patient_id">Patient <span class="required">*</span></label>
                <select id="patient_id" name="patient_id" required>
                    <option value="">Select Patient</option>
                    {% for patient in patients %}
                    <option value="{{ patient.patient_id }}">{{ patient.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="doctor_id">Doctor <span class="required">*</span></label>
                <select id="doctor_id" name="doctor_id" required>
                    <option value="">Select Doctor</option>
                    {% for doctor in doctors %}
                    <option value="{{ doctor.doctor_id }}">{{ doctor.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group full-width">
                <label for="medicines">Medicines <span class="required">*</span></label>
                <textarea id="medicines" name="medicines" rows="3" required placeholder="List medicines..."></textarea>
            </div>
            <div class="form-group">
                <label for="dosage">Dosage</label>
                <input type="text" id="dosage" name="dosage" placeholder="e.g., 2 times daily">
            </div>
            <div class="form-group full-width">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" rows="2" placeholder="Additional notes..."></textarea>
            </div>
            <div class="form-actions full-width">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Prescription</button>
                <a href="{{ url_for('prescriptions.list_prescriptions') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
