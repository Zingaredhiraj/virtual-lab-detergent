{% extends "base.html" %}
{% block title %}Edit Prescription - HMS{% endblock %}
{% block page_title %}Edit Prescription{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3><i class="fas fa-prescription"></i> Edit Prescription #{{ prescription.prescription_id }}</h3>
        <a href="{{ url_for('prescriptions.list_prescriptions') }}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="card-body">
        <form method="POST" class="form-grid">
            <div class="form-group">
                <label for="patient_id">Patient <span class="required">*</span></label>
                <select id="patient_id" name="patient_id" required>
                    {% for p in patients %}
                    <option value="{{ p.patient_id }}" {% if prescription.patient_id == p.patient_id %}selected{% endif %}>{{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="doctor_id">Doctor <span class="required">*</span></label>
                <select id="doctor_id" name="doctor_id" required>
                    {% for d in doctors %}
                    <option value="{{ d.doctor_id }}" {% if prescription.doctor_id == d.doctor_id %}selected{% endif %}>{{ d.name }} - {{ d.specialization }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="prescribed_date">Date <span class="required">*</span></label>
                <input type="date" id="prescribed_date" name="prescribed_date" value="{{ prescription.prescribed_date }}" required>
            </div>
            <div class="form-group full-width">
                <label for="medicines">Medicines <span class="required">*</span></label>
                <textarea id="medicines" name="medicines" rows="3" required>{{ prescription.medicines }}</textarea>
            </div>
            <div class="form-group full-width">
                <label for="dosage">Dosage Instructions</label>
                <input type="text" id="dosage" name="dosage" value="{{ prescription.dosage or '' }}">
            </div>
            <div class="form-group full-width">
                <label for="notes">Additional Notes</label>
                <textarea id="notes" name="notes" rows="2">{{ prescription.notes or '' }}</textarea>
            </div>
            <div class="form-actions full-width">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Prescription</button>
                <a href="{{ url_for('prescriptions.list_prescriptions') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
