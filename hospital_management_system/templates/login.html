{% extends "base.html" %}
{% block title %}Login - MediCore HMS{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🏥</div>
            <h1>MediCore HMS</h1>
            <p>Hospital Management System</p>
            <div class="login-tabs">
                <div class="login-tab active">Login</div>
                <div class="login-tab">Register</div>
            </div>
        </div>

        <div class="login-credentials">
            <strong>Admin:</strong> admin / admin123<br>
            <strong>Patient:</strong> patient1 / patient123
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <div class="login-extras">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign In to Dashboard</button>
        </form>

        <div class="login-footer-text">
            Don't have an account? <a href="#">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
