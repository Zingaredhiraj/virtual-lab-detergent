{% extends "base.html" %}
{% block title %}Edit Doctor - MediCore HMS{% endblock %}
{% block page_title %}Edit Doctor{% endblock %}
{% block page_subtitle %}Update doctor information{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3><i class="fas fa-user-md"></i> Edit: {{ doctor.name }}</h3>
        <a href="{{ url_for('doctors.list_doctors') }}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="card-body">
        <form method="POST" class="form-grid">
            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" value="{{ doctor.name }}" required>
            </div>
            <div class="form-group">
                <label for="specialization">Specialization <span class="required">*</span></label>
                <input type="text" id="specialization" name="specialization" value="{{ doctor.specialization }}" required>
            </div>
            <div class="form-group">
                <label for="contact">Phone</label>
                <input type="text" id="contact" name="contact" value="{{ doctor.contact or '' }}">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ doctor.email or '' }}">
            </div>
            <div class="form-group">
                <label for="department_id">Department</label>
                <select id="department_id" name="department_id">
                    <option value="">Select Department</option>
                    {% for dept in departments %}
                    <option value="{{ dept.department_id }}" {% if doctor.department_id == dept.department_id %}selected{% endif %}>{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="schedule">Schedule</label>
                <input type="text" id="schedule" name="schedule" value="{{ doctor.schedule or '' }}">
            </div>
            <div class="form-actions full-width">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Doctor</button>
                <a href="{{ url_for('doctors.list_doctors') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
