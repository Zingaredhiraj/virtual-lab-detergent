{% extends "base.html" %}
{% block title %}Add Doctor - MediCore HMS{% endblock %}
{% block page_title %}Add Doctor{% endblock %}
{% block page_subtitle %}Register a new doctor{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3><i class="fas fa-user-md"></i> Add New Doctor</h3>
        <a href="{{ url_for('doctors.list_doctors') }}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="card-body">
        <form method="POST" class="form-grid">
            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" required placeholder="Dr. Name">
            </div>
            <div class="form-group">
                <label for="specialization">Specialization <span class="required">*</span></label>
                <input type="text" id="specialization" name="specialization" required placeholder="e.g., Cardiology">
            </div>
            <div class="form-group">
                <label for="contact">Phone</label>
                <input type="text" id="contact" name="contact" placeholder="+91 99999 99999">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="doctor@email.com">
            </div>
            <div class="form-group">
                <label for="department_id">Department</label>
                <select id="department_id" name="department_id">
                    <option value="">Select Department</option>
                    {% for dept in departments %}
                    <option value="{{ dept.department_id }}">{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="schedule">Schedule</label>
                <input type="text" id="schedule" name="schedule" placeholder="e.g., Mon-Fri 9AM-5PM">
            </div>
            <div class="form-actions full-width">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Doctor</button>
                <a href="{{ url_for('doctors.list_doctors') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
