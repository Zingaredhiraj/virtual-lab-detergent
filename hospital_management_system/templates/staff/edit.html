{% extends "base.html" %}
{% block title %}Edit Staff - MediCore HMS{% endblock %}
{% block page_title %}Edit Staff{% endblock %}
{% block page_subtitle %}Update staff information{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3><i class="fas fa-users-cog"></i> Edit: {{ staff_member.name }}</h3>
        <a href="{{ url_for('staff.list_staff') }}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="card-body">
        <form method="POST" class="form-grid">
            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" value="{{ staff_member.name }}" required>
            </div>
            <div class="form-group">
                <label for="role">Role <span class="required">*</span></label>
                <select id="role" name="role" required>
                    <option value="Nurse" {% if staff_member.role == 'Nurse' %}selected{% endif %}>Nurse</option>
                    <option value="Receptionist" {% if staff_member.role == 'Receptionist' %}selected{% endif %}>Receptionist</option>
                    <option value="Lab Technician" {% if staff_member.role == 'Lab Technician' %}selected{% endif %}>Lab Technician</option>
                    <option value="Pharmacist" {% if staff_member.role == 'Pharmacist' %}selected{% endif %}>Pharmacist</option>
                    <option value="Admin" {% if staff_member.role == 'Admin' %}selected{% endif %}>Admin</option>
                    <option value="Other" {% if staff_member.role == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="contact">Phone</label>
                <input type="text" id="contact" name="contact" value="{{ staff_member.contact or '' }}">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" value="{{ staff_member.email or '' }}">
            </div>
            <div class="form-actions full-width">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Staff</button>
                <a href="{{ url_for('staff.list_staff') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
