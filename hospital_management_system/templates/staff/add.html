{% extends "base.html" %}
{% block title %}Add Staff - HMS{% endblock %}
{% block page_title %}Add New Staff{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3><i class="fas fa-user-plus"></i> Add New Staff Member</h3>
        <a href="{{ url_for('staff.list_staff') }}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="card-body">
        <form method="POST" class="form-grid">
            <div class="form-group">
                <label for="name">Full Name <span class="required">*</span></label>
                <input type="text" id="name" name="name" required placeholder="Staff member name">
            </div>
            <div class="form-group">
                <label for="role">Role <span class="required">*</span></label>
                <input type="text" id="role" name="role" required placeholder="e.g., Nurse, Technician">
            </div>
            <div class="form-group">
                <label for="contact">Contact <span class="required">*</span></label>
                <input type="text" id="contact" name="contact" required placeholder="Phone number">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Email address">
            </div>
            <div class="form-group">
                <label for="department_id">Department</label>
                <select id="department_id" name="department_id">
                    <option value="">Select Department</option>
                    {% for dept in departments %}
                    <option value="{{ dept.department_id }}">{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-actions full-width">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Staff</button>
                <a href="{{ url_for('staff.list_staff') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
