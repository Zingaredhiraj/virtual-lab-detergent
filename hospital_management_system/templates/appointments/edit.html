{% extends "base.html" %}
{% block title %}Edit Appointment - HMS{% endblock %}
{% block page_title %}Edit Appointment{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h3><i class="fas fa-calendar-check"></i> Edit Appointment #{{ appointment.appointment_id }}</h3>
        <a href="{{ url_for('appointments.list_appointments') }}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
    <div class="card-body">
        <form method="POST" class="form-grid">
            <div class="form-group">
                <label for="patient_id">Patient <span class="required">*</span></label>
                <select id="patient_id" name="patient_id" required>
                    {% for p in patients %}
                    <option value="{{ p.patient_id }}" {% if appointment.patient_id == p.patient_id %}selected{% endif %}>{{ p.name }} (ID: {{ p.patient_id }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="doctor_id">Doctor <span class="required">*</span></label>
                <select id="doctor_id" name="doctor_id" required>
                    {% for d in doctors %}
                    <option value="{{ d.doctor_id }}" {% if appointment.doctor_id == d.doctor_id %}selected{% endif %}>{{ d.name }} - {{ d.specialization }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="appointment_date">Date & Time <span class="required">*</span></label>
                <input type="datetime-local" id="appointment_date" name="appointment_date" value="{{ appointment.appointment_date.strftime('%Y-%m-%dT%H:%M') if appointment.appointment_date else '' }}" required>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="Pending" {% if appointment.status == 'Pending' %}selected{% endif %}>Pending</option>
                    <option value="Confirmed" {% if appointment.status == 'Confirmed' %}selected{% endif %}>Confirmed</option>
                    <option value="Completed" {% if appointment.status == 'Completed' %}selected{% endif %}>Completed</option>
                    <option value="Cancelled" {% if appointment.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                </select>
            </div>
            <div class="form-group full-width">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" rows="3">{{ appointment.notes or '' }}</textarea>
            </div>
            <div class="form-actions full-width">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Appointment</button>
                <a href="{{ url_for('appointments.list_appointments') }}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
